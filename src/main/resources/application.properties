spring.application.name=movieapi

# JPA - On est en Base de données H2 & ddl-auto on est create-drop:
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=trace

# Swagger:
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

#Logs:
logging.level.org.example.movieapi=INFO
logging.level.org.example.movieapi.controller.MovieController=DEBUG
logging.level.org.example.movieapi.service=DEBUG